<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>快存图片</title><link rel="stylesheet" href="ui.css"></head>
<body class="popup">
  <header class="brand"><img src="icons/48.png" width="36" height="36" alt=""><div><h1>快存图片</h1><p>点一下，存到你的文件夹。</p></div></header>
  <section class="folder"><h2>当前图片保存文件夹</h2><p id="folder-name" class="folder-name">正在读取…</p><span id="status" class="status">检查保存权限</span></section>
  <button id="settings" type="button" class="primary full">选择 / 更改图片保存位置</button>
  <label class="switch-row"><span>网页图片上显示下载按钮</span><input id="enabled" type="checkbox" class="toggle" checked aria-label="网页图片上显示下载按钮"></label>
  <label class="switch-row video-switch-row"><span class="setting-label">保存视频<small id="video-help">支持 B 站、YouTube、X 和普通视频直链。</small></span><input id="video-enabled" type="checkbox" class="toggle" aria-label="保存视频" aria-describedby="video-help" disabled></label>
  <p id="video-setting-error" class="notice" data-error="true" role="alert" hidden></p>
  <section id="platform-download" class="platform-download" aria-label="平台视频下载" hidden>
    <button id="save-platform" class="secondary full" type="button" disabled>保存当前视频</button>
    <p id="platform-hint" class="detail"></p>
    <progress id="video-progress" max="100" aria-label="当前视频下载进度" hidden></progress>
    <p id="video-job" class="notice" role="status" hidden></p>
  </section>
  <p id="last-save" class="last-save"></p>
  <footer>鼠标移到图片上 → 点击「↓ 快存」<br>图片会存入所选文件夹 · 重名自动编号</footer>
  <script type="module" src="popup.js"></script>
</body></html>
