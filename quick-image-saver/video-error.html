<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>快存图片 · 视频保存失败</title>
  <link rel="stylesheet" href="ui.css">
  <style>.video-error-message:not(:target){display:none}</style>
</head>
<body class="options">
  <main class="card hero">
    <h2>视频保存失败</h2>
    <p id="unsupported" class="muted video-error-message">此视频没有可直接下载的文件地址。可保存 MP4、WebM 等普通视频文件。</p>
    <p id="failed" class="muted video-error-message">无法开始下载视频。请确认视频仍能播放，再试一次。</p>
    <p id="platform" class="muted video-error-message">请点击工具栏的「快存图片」，在弹窗中查看下载状态。</p>
  </main>
</body>
</html>
